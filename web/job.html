<!doctype html><html lang="fr" dir="ltr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Masari · Offre</title>
<style>
:root{--bg:#f7faf9;--text:#17312c;--muted:#6d7c78;--line:#dfe8e5;--brand:#4f877e;--strong:#174f47;--soft:#eef7f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;gap:18px;margin-bottom:22px}.logo{font-size:32px;font-weight:950;color:var(--strong);text-decoration:none}.tag{color:var(--muted);font-size:13px}
.langs{display:flex;gap:6px}.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-weight:800}.langs button.active{background:var(--strong);color:#fff}
.back{display:inline-block;margin-bottom:14px;color:var(--strong);font-weight:850;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 14px 36px rgba(23,79,71,.08)}
.head{display:flex;justify-content:space-between;gap:16px}.title{margin:0;font-size:clamp(25px,4vw,38px);line-height:1.2}.employer{margin-top:8px;color:var(--muted)}.badge{height:max-content;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--strong);font-size:11px;font-weight:900;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}.fact{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fafcfb}.fact b{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.section h2{font-size:16px}.body{white-space:pre-wrap;line-height:1.8;color:#40534e}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#f6f8f7}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}.apply,.source{padding:11px 16px;border-radius:12px;text-decoration:none;font-weight:900}.apply{background:var(--strong);color:#fff}.source{border:1px solid var(--line);color:var(--strong)}
.state{padding:24px;background:#fff;border:1px solid var(--line);border-radius:18px;color:var(--muted)}[dir=rtl] .card,[dir=rtl] .state{text-align:right}
@media(max-width:700px){.head{display:block}.badge{display:inline-block;margin-top:12px}.facts{grid-template-columns:1fr}.card{padding:18px 15px}.actions{display:block}.apply,.source{display:block;text-align:center;margin-top:8px}}
</style></head><body><div class="wrap">
<header class="top"><div><a class="logo" href="/">Masari</a><div class="tag" id="tag"></div></div><div class="langs"><button data-lang="ar">العربية</button><button data-lang="fr">Français</button><button data-lang="en">English</button></div></header>
<a class="back" href="/" id="back"></a><main id="main"><div class="state" id="state"></div></main></div>
<script>
const UI={
ar:{tag:'فرص العمل في المغرب',back:'العودة إلى البحث',loading:'جاري تحميل تفاصيل الوظيفة…',gone:'هذه الوظيفة لم تعد متاحة.',positions:'عدد المناصب',pub:'تاريخ النشر',deadline:'آخر أجل',location:'المكان',work:'مكان العمل',contract:'نوع العقد',salary:'الأجر',reference:'مرجع العرض',description:'تفاصيل الوظيفة',profile:'الملف المطلوب',education:'التكوين / الشهادة',experience:'الخبرة',languages:'اللغات',specialties:'التخصصات',apply:'الترشح الآن',official:'فتح الإعلان الرسمي',employmentSector:'نوع القطاع',publicSector:'القطاع العمومي',privateSector:'القطاع الخاص'},
fr:{tag:'Emploi au Maroc',back:'Retour à la recherche',loading:"Chargement des détails…",gone:"Cette offre n’est plus disponible.",positions:'Nombre de postes',pub:'Date de publication',deadline:'Date limite',location:'Localisation',work:'Lieu de travail',contract:'Type de contrat',salary:'Salaire',reference:"Référence de l’offre",description:"Détails de l’offre",profile:'Profil recherché',education:'Formation / diplôme',experience:'Expérience',languages:'Langues',specialties:'Spécialités',apply:'Postuler',official:"Voir l’annonce officielle",employmentSector:"Secteur",publicSector:"Secteur public",privateSector:"Secteur privé"},
en:{tag:'Jobs in Morocco',back:'Back to search',loading:'Loading job details…',gone:'This job is no longer available.',positions:'Number of positions',pub:'Publication date',deadline:'Application deadline',location:'Location',work:'Work location',contract:'Contract type',salary:'Salary',reference:'Job reference',description:'Job details',profile:'Required profile',education:'Education / diploma',experience:'Experience',languages:'Languages',specialties:'Specialties',apply:'Apply now',official:'View official announcement',employmentSector:'Sector',publicSector:'Public sector',privateSector:'Private sector'}};
let lang=localStorage.getItem('masari.lang')||((navigator.language||'fr').startsWith('ar')?'ar':(navigator.language||'fr').startsWith('en')?'en':'fr'),job=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));const val=v=>Array.isArray(v)?v.filter(Boolean).join(' · '):String(v??'').trim();
function date(v){const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:''}
function fact(k,v){v=val(v);return v?`<div class="fact"><b>${esc(k)}</b>${esc(v)}</div>`:''}function sec(k,v){v=val(v);return v?`<section class="section"><h2>${esc(k)}</h2><div class="body">${esc(v)}</div></section>`:''}
function chips(k,v){v=Array.isArray(v)?v.filter(Boolean):[];return v.length?`<section class="section"><h2>${esc(k)}</h2><div class="chips">${v.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section>`:''}
function contract(job){const a=Array.isArray(job.contract_options)?job.contract_options:[];return a.length?a.map(x=>`${val(x.type)}${x.positions?` (${x.positions})`:''}`).join(' · '):val(job.contract_type||job.recruitment_type)}
function applyHref(j){return val(j.application_url||j.application_site||j.application_notice_url||j.opening_order_url||j.url)}
function render(){if(!job)return;const t=UI[lang],title=val(job.job_name||job.title||job.search_title||job.listing_title),employer=val(job.company||job.administration),source=val(job.source_label||(job.source==='anapec'?'ANAPEC':'Emploi-Public.ma')),href=applyHref(job),sourceUrl=val(job.url||job.source_url);
const employmentSector=(job.employment_sector||job.scope||(job.source==='anapec'?'private':'public'));const facts=[fact(t.employmentSector,employmentSector==='private'?t.privateSector:t.publicSector),fact(t.positions,job.positions),fact(t.pub,date(job.publication_date)),job.deadline?fact(t.deadline,date(job.deadline)):'',fact(t.location,job.location),fact(t.work,job.work_location_text),fact(t.contract,contract(job)),fact(t.salary,job.salary),fact(t.reference,job.source_reference||job.contest_code)].join('');
document.getElementById('main').innerHTML=`<article class="card"><div class="head"><div><h1 class="title">${esc(title)}</h1>${employer?`<div class="employer">${esc(employer)}</div>`:''}</div><span class="badge">${esc(source)}</span></div>${facts?`<div class="facts">${facts}</div>`:''}${sec(t.description,job.description)}${sec(t.profile,job.profile)}${sec(t.education,job.education)}${sec(t.experience,job.experience)}${chips(t.languages,job.languages)}${chips(t.specialties,job.specialties)}<div class="actions">${href?`<a class="apply" target="_blank" rel="noopener" href="${esc(href)}">${esc(t.apply)}</a>`:''}${sourceUrl&&sourceUrl!==href?`<a class="source" target="_blank" rel="noopener" href="${esc(sourceUrl)}">${esc(t.official)}</a>`:''}</div></article>`}
function setLang(x){lang=x;localStorage.setItem('masari.lang',x);document.documentElement.lang=x;document.documentElement.dir=x==='ar'?'rtl':'ltr';document.getElementById('tag').textContent=UI[x].tag;document.getElementById('back').textContent=(x==='ar'?'→ ':'← ')+UI[x].back;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.lang===x));if(job)render();else document.getElementById('state').textContent=UI[x].loading}
async function load(){const id=decodeURIComponent(location.pathname.split('/').slice(2).join('/'));try{const r=await fetch('/api/job/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw 0;job=(await r.json()).job;document.title='Masari · '+val(job.job_name||job.title||job.search_title||job.listing_title);render()}catch{document.getElementById('main').innerHTML=`<div class="state">${esc(UI[lang].gone)}</div>`}}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));setLang(lang);load();
</script></body></html>
