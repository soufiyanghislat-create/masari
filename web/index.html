<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Masari — النسخة التجريبية</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--dark:#111827;--soft:#f1f5f9;--ok:#166534;--warn:#9a3412}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.shell{max-width:1050px;margin:auto;padding:34px 18px 80px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}
.logo{font-size:34px;font-weight:900;letter-spacing:-1px}.badge{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;background:#fff3cd;color:#7c5c00;font-size:12px;font-weight:700}
.tagline{color:var(--muted);margin-top:7px;direction:rtl}.meta{text-align:right;color:var(--muted);font-size:12px;line-height:1.7}
.search{position:relative}.row{display:flex;gap:10px}.row input{flex:1;height:58px;padding:0 18px;border:1px solid var(--line);border-radius:15px;background:white;font-size:17px;outline:none}
.row input:focus{border-color:#9ca3af;box-shadow:0 0 0 4px rgba(17,24,39,.05)}.row button{border:0;border-radius:15px;background:var(--dark);color:white;font-weight:800;padding:0 24px;cursor:pointer}
.suggest{position:absolute;top:64px;left:0;right:116px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 16px 42px rgba(0,0,0,.12);z-index:10;overflow:hidden}
.srow{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}.srow:last-child{border-bottom:0}.srow:hover{background:var(--soft)}.slabel{font-weight:800}.smeta{color:var(--muted);font-size:12px;margin-top:3px}
.state{margin:20px 0;color:var(--muted);direction:rtl}.profession{margin:18px 0;background:var(--dark);color:white;border-radius:17px;padding:18px}.profession .name{font-size:21px;font-weight:900}.profession .pm{opacity:.75;margin-top:5px}
.grid{display:grid;gap:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px}.title{font-size:20px;font-weight:900}.admin{color:var(--muted);margin-top:4px}.sourcebadge{display:inline-block;margin-top:10px;padding:5px 8px;background:#eef2ff;border-radius:999px;font-size:11px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.tag{padding:6px 9px;background:var(--soft);border-radius:999px;font-size:12px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.info>div{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fafafa}.info span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.official{display:inline-block;margin-top:15px;color:var(--dark);font-weight:850;text-decoration:none}.source{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.choice{margin-top:18px;background:white;border:1px solid var(--line);border-radius:17px;padding:18px;direction:rtl}.choice button{margin:5px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--soft);cursor:pointer;font-weight:750}
.init{background:white;border:1px solid var(--line);border-radius:17px;padding:24px;direction:rtl}.ok{color:var(--ok)}.warn{color:var(--warn)}
@media(max-width:700px){.top{display:block}.meta{text-align:left;margin-top:12px}.row{display:block}.row button{height:50px;width:100%;margin-top:8px}.suggest{top:120px;right:0}.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <div class="logo">Masari</div>
      <div class="badge">STAGING · نسخة تجريبية</div>
      <div class="tagline">بحث مهني سريع ودقيق في فرص العمل بالمغرب</div>
    </div>
    <div class="meta" id="meta">جاري قراءة حالة البيانات…</div>
  </div>

  <div class="search">
    <div class="row">
      <input id="q" autocomplete="off" placeholder="technicien génie civil, comptable, gardien…">
      <button id="go">بحث</button>
    </div>
    <div id="suggestions" class="suggest" hidden></div>
  </div>

  <div id="state" class="state">اكتب المهنة التي تبحث عنها.</div>
  <div id="content"></div>
</div>
<script>
const q=document.getElementById('q'),go=document.getElementById('go'),sug=document.getElementById('suggestions'),state=document.getElementById('state'),content=document.getElementById('content'),meta=document.getElementById('meta');
let timer;
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]))}
function dt(v){if(!v)return'—';return String(v).replace('T00:00:00','').replace('T',' ')}
async function loadMeta(){
  try{
    const r=await fetch('/api/meta',{cache:'no-store'}),d=await r.json();
    if(d.ready){
      const p=d.manifest?.published_at?dt(d.manifest.published_at):'—';
      meta.innerHTML=`<span class="ok">● البيانات جاهزة</span><br>${d.jobs} إعلان · آخر تحديث: ${esc(p)}`;
    }else{
      meta.innerHTML=`<span class="warn">● تهيئة أول تحديث</span><br>سيظهر البحث تلقائياً عند اكتمال التحقق`;
    }
  }catch{meta.textContent='تعذر قراءة حالة التحديث'}
}
async function suggest(){
  const v=q.value.trim();clearTimeout(timer);if(v.length<2){sug.hidden=true;return}
  timer=setTimeout(async()=>{
    const r=await fetch('/api/suggest?q='+encodeURIComponent(v)),d=await r.json(),rows=d.suggestions||[];
    if(!rows.length){sug.hidden=true;return}
    sug.innerHTML=rows.map(x=>`<div class="srow" data-id="${esc(x.profession_id)}"><div class="slabel">${esc(x.label)}</div><div class="smeta">${esc(x.sector)} · ${esc(x.family)}</div></div>`).join('');
    sug.hidden=false;sug.querySelectorAll('.srow').forEach(el=>el.onclick=()=>{q.value=el.dataset.id;sug.hidden=true;search()});
  },160)
}
function choices(d){
  content.innerHTML=`<div class="choice"><b>العبارة تطابق أكثر من مهنة. اختر المقصود:</b><div>${(d.suggestions||[]).map(x=>`<button data-id="${esc(x.profession_id)}">${esc(x.label)}</button>`).join('')}</div></div>`;
  content.querySelectorAll('.choice button').forEach(el=>el.onclick=()=>{q.value=el.dataset.id;search()})
}
function results(d){
  const p=d.profession,rows=d.results||[];
  content.innerHTML=`<div class="profession"><div class="name">${esc(p.label)}</div><div class="pm">${esc(p.sector)} · ${esc(p.family)} · ${rows.length} نتيجة</div></div><div class="grid">${
    rows.length?rows.map(j=>`<article class="card"><div class="title">${esc(j.title)}</div><div class="admin">${esc(j.administration||'—')}</div><div class="sourcebadge">Emploi-Public.ma</div><div class="tags">${(j.specialties||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="info"><div><span>عدد المناصب</span>${esc(j.positions??'—')}</div><div><span>تاريخ النشر</span>${esc(dt(j.publication_date))}</div><div><span>آخر أجل</span>${esc(dt(j.deadline))}</div></div><a class="official" target="_blank" rel="noopener" href="${esc(j.url)}">فتح الإعلان الرسمي ←</a><details class="source"><summary>بيانات المصدر</summary><div>${esc(j.source_title||'—')}</div></details></article>`).join(''):`<div class="init">لا توجد عروض مفتوحة لهذه المهنة حالياً.</div>`
  }</div>`
}
async function search(){
  const v=q.value.trim();if(!v)return;sug.hidden=true;state.textContent='جاري البحث…';content.innerHTML='';
  try{
    const r=await fetch('/api/search?q='+encodeURIComponent(v)+'&limit=15',{cache:'no-store'});
    const d=await r.json();
    if(r.status===503){state.textContent='Masari يقوم الآن ببناء أول index موثّق. أعد المحاولة بعد دقائق.';content.innerHTML='<div class="init">التحديث الأول يعمل في الخلفية، والموقع نفسه متاح.</div>';return}
    if(!r.ok)throw new Error(d.detail||'خطأ');
    if(d.selection_required){state.textContent='يلزم تحديد المهنة بدقة.';choices(d)}else{state.textContent='النتائج النشطة فقط؛ المنتهي لا يظهر.';results(d)}
  }catch(e){state.textContent='خطأ: '+e.message}
}
q.addEventListener('input',suggest);q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});go.addEventListener('click',search);document.addEventListener('click',e=>{if(!e.target.closest('.search'))sug.hidden=true});
loadMeta();setInterval(loadMeta,30000);
</script>
</body>
</html>
