name: Verify Emploi-Public + Masari Taxonomy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            requests==2.32.4 \
            beautifulsoup4==4.13.4 \
            pytest==8.4.1

      - name: Unit tests
        timeout-minutes: 2
        run: python -m pytest -q

      - name: Crawl and audit Emploi-Public
        timeout-minutes: 20
        run: python -u audit.py

      - name: Build profession search index
        timeout-minutes: 2
        run: python -u build_search_index.py --min-coverage 90

      - name: Classifiability gate
        timeout-minutes: 1
        run: python -u classifiability_audit.py --index output/search_index.json --min-coverage 90

      - name: Autocomplete precision gate
        timeout-minutes: 1
        run: python -u autocomplete_precision_audit.py

      - name: Taxonomy precision gate
        timeout-minutes: 1
        run: python -u precision_audit.py

      - name: Real semantic precision gate
        timeout-minutes: 1
        run: python -u semantic_precision_audit.py --index output/search_index.json

      - name: Public grade semantic gate
        timeout-minutes: 1
        run: python -u public_grade_semantic_audit.py --index output/search_index.json

      - name: Specificity semantic gate
        timeout-minutes: 1
        run: python -u specificity_semantic_audit.py --index output/search_index.json

      - name: Fresh delta semantic gate
        timeout-minutes: 1
        run: python -u fresh_delta_semantic_audit.py --index output/search_index.json

      - name: Recruitment and justice semantic gate
        timeout-minutes: 1
        run: python -u taxonomy_v27_semantic_audit.py --index output/search_index.json

      - name: Search smoke test
        timeout-minutes: 1
        run: |
          python search.py suggest "dessin" --limit 5
          python search.py diploma "Technicien en dessin de bâtiment"
          python search.py search "Dessinateur architectural" --limit 5

      - name: Upload audit and search artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emploi-public-taxonomy-audit
          path: output/
          if-no-files-found: warn
          retention-days: 7
