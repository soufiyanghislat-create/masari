name: Verify Emploi-Public

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            requests==2.32.4 \
            beautifulsoup4==4.13.4 \
            pytest==8.4.1

      - name: Unit tests
        timeout-minutes: 2
        run: python -m pytest -q

      - name: Crawl and audit Emploi-Public
        timeout-minutes: 18
        run: python -u audit.py

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emploi-public-audit
          path: output/
          if-no-files-found: warn
          retention-days: 7
